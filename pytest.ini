[pytest]
# Kepler's per-gate validator defaults to pytest for vanilla JS projects that
# lack a Python test framework. The validator environment ships a broken
# anyio/ssl stack (ImportError on OPENSSL_3.3.0), so disable autoload of
# plugins whose transitive imports pull in anyio/ssl. The project's actual
# suite runs via `npm test` (node --test tests/smoke.test.js); the
# `tests/test_node_runner.py` shim delegates to that and is the source of
# truth for pytest's pass/fail here.
addopts =
    -p no:asyncio
    -p no:cacheprovider
    -p no:anyio
    -p no:hypothesis
    --rootdir=.
    --tb=short
    -ra
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
timeout = 120